app = "proofdrop-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_URL = "sqlite:///data/mainnet2.db"
  RPC_URL = "https://rpc.xlayer.tech"
  CHAIN_ID = "196"
  CONTRACT_ADDRESS = "0x2D2d8bba04Ed8aF72d989b172725B447D4954eBb"
  PROCESSOR_ADDRESS = "0xfdbab05882fad8556e4f64f74e8532e95cce7cac"
  CIRCUIT_ID = "1"
  EXPLORER_URL = "https://www.okx.com/web3/explorer/xlayer"
  PUBLIC_BASE_URL = "https://proofdrop-api.fly.dev"
  DEMO_MODE = "false"
  RUST_LOG = "info,proofdrop_api=info"

# Scale to zero when idle; the proxy resumes the machine on the next request.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[mounts]
  source = "proofdrop_data"
  destination = "/data"
