app = "proofdrop-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_URL = "sqlite:///data/mainnet.db"
  RPC_URL = "https://rpc.xlayer.tech"
  CHAIN_ID = "196"
  CONTRACT_ADDRESS = "0xc3cFf081656A338a84Ce80F4463aA69B375841D9"
  PROCESSOR_ADDRESS = "0x87BFCa3494Aa228fF589ab9B642143A5e8c8F9a6"
  CIRCUIT_ID = "24"
  EXPLORER_URL = "https://www.okx.com/web3/explorer/xlayer"
  PUBLIC_BASE_URL = "https://proofdrop-api.fly.dev"
  DEMO_MODE = "false"
  RUST_LOG = "info,proofdrop_api=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[mounts]
  source = "proofdrop_data"
  destination = "/data"
