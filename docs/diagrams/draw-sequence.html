<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProofDrop draw sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f6f0e4;
      --ink: #171410;
      --muted: #756b5c;
      --rule: #d8cdb9;
      --accent: #ff4d00;
    }
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.64rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: clamp(1.6rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1060px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Draw lifecycle</p>
    <h1>One list. One seed. One circuit call.</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-title sequence-desc">
        <title id="sequence-title">ProofDrop draw sequence</title>
        <desc id="sequence-desc">A creator escrows a prize, entrants sign free entries, the service commits the list, and the escrow contract captures a seed and calls a TapeOut circuit before paying the winner.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#756b5c"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff4d00"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f6f0e4"/>

        <!-- lifelines -->
        <line x1="110" y1="88" x2="110" y2="700" stroke="rgba(23,20,16,0.18)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="300" y1="88" x2="300" y2="700" stroke="rgba(23,20,16,0.18)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="490" y1="88" x2="490" y2="700" stroke="rgba(23,20,16,0.18)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="700" y1="88" x2="700" y2="700" stroke="rgba(23,20,16,0.18)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="910" y1="88" x2="910" y2="700" stroke="rgba(23,20,16,0.18)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- activation bars -->
        <rect x="486" y="126" width="8" height="462" fill="rgba(23,20,16,0.04)" stroke="#756b5c" stroke-width="0.8"/>
        <rect x="696" y="171" width="8" height="476" fill="rgba(255,77,0,0.06)" stroke="#ff4d00" stroke-width="0.8"/>
        <rect x="906" y="441" width="8" height="52" fill="rgba(255,77,0,0.06)" stroke="#ff4d00" stroke-width="0.8"/>

        <!-- messages -->
        <line x1="114" y1="130" x2="486" y2="130" stroke="#756b5c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="228" y="108" width="144" height="14" rx="2" fill="#f6f0e4"/>
        <text x="300" y="118" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">CREATE DRAW + PRIZE</text>

        <line x1="494" y1="175" x2="696" y2="175" stroke="#756b5c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="536" y="153" width="118" height="14" rx="2" fill="#f6f0e4"/>
        <text x="595" y="163" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ESCROW + FEE</text>

        <line x1="304" y1="220" x2="486" y2="220" stroke="#756b5c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="326" y="198" width="138" height="14" rx="2" fill="#f6f0e4"/>
        <text x="395" y="208" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">SIGN ENTRY · FREE</text>

        <path d="M 494,258 H 534 Q 542,258 542,266 V 274 Q 542,282 534,282 H 494" fill="none" stroke="#756b5c" stroke-width="1.1" marker-end="url(#arrow)"/>
        <text x="552" y="266" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace">VERIFY + APPEND</text>

        <line x1="494" y1="310" x2="696" y2="310" stroke="#756b5c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="528" y="288" width="134" height="14" rx="2" fill="#f6f0e4"/>
        <text x="595" y="298" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">COMMIT ROOT + COUNT</text>

        <path d="M 704,348 H 744 Q 752,348 752,356 V 364 Q 752,372 744,372 H 704" fill="none" stroke="#ff4d00" stroke-width="1.1" marker-end="url(#arrow-accent)"/>
        <text x="762" y="356" fill="#ff4d00" font-size="8" font-family="'IBM Plex Mono', monospace">SEED BLOCK = +5</text>

        <line x1="494" y1="400" x2="696" y2="400" stroke="#756b5c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="538" y="378" width="114" height="14" rx="2" fill="#f6f0e4"/>
        <text x="595" y="388" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">CAPTURE + DRAW</text>

        <line x1="704" y1="445" x2="906" y2="445" stroke="#ff4d00" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="752" y="423" width="106" height="14" rx="2" fill="#f6f0e4"/>
        <text x="805" y="433" fill="#ff4d00" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">EVAL(ID, X) × 4</text>

        <line x1="906" y1="490" x2="704" y2="490" stroke="#756b5c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="764" y="468" width="82" height="14" rx="2" fill="#f6f0e4"/>
        <text x="805" y="478" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">4 × 9 BITS</text>

        <path d="M 704,528 H 744 Q 752,528 752,536 V 544 Q 752,552 744,552 H 704" fill="none" stroke="#756b5c" stroke-width="1.1" marker-end="url(#arrow)"/>
        <text x="762" y="536" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace">MOD ENTRANT COUNT</text>

        <line x1="494" y1="580" x2="696" y2="580" stroke="#756b5c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="534" y="558" width="122" height="14" rx="2" fill="#f6f0e4"/>
        <text x="595" y="568" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">SETTLE(WINNER, PROOF)</text>

        <line x1="696" y1="625" x2="304" y2="625" stroke="#ff4d00" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
        <rect x="340" y="603" width="136" height="14" rx="2" fill="#f6f0e4"/>
        <text x="408" y="613" fill="#ff4d00" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">PRIZE → WINNER</text>

        <!-- actor boxes -->
        <rect x="40" y="30" width="140" height="56" rx="6" fill="#f6f0e4" stroke="#171410" stroke-width="1.1"/>
        <text x="110" y="53" fill="#171410" font-size="14" font-weight="600" text-anchor="middle">Creator</text>
        <text x="110" y="69" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">wallet</text>

        <rect x="230" y="30" width="140" height="56" rx="6" fill="#f6f0e4" stroke="#171410" stroke-width="1.1"/>
        <text x="300" y="53" fill="#171410" font-size="14" font-weight="600" text-anchor="middle">Entrant</text>
        <text x="300" y="69" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">wallet · one entry</text>

        <rect x="420" y="30" width="140" height="56" rx="6" fill="#171410" stroke="#171410" stroke-width="1.1"/>
        <text x="490" y="53" fill="#f6f0e4" font-size="14" font-weight="600" text-anchor="middle">ProofDrop</text>
        <text x="490" y="69" fill="rgba(246,240,228,0.6)" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">app + rust api</text>

        <rect x="630" y="30" width="140" height="56" rx="6" fill="#fff1e8" stroke="#ff4d00" stroke-width="1.4"/>
        <text x="700" y="53" fill="#171410" font-size="14" font-weight="600" text-anchor="middle">Escrow</text>
        <text x="700" y="69" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">X Layer contract</text>

        <rect x="840" y="30" width="140" height="56" rx="6" fill="#fff1e8" stroke="#ff4d00" stroke-width="1.4"/>
        <text x="910" y="53" fill="#171410" font-size="14" font-weight="600" text-anchor="middle">Circuit #24</text>
        <text x="910" y="69" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">TapeOut eval()</text>

        <!-- legend -->
        <line x1="40" y1="724" x2="76" y2="724" stroke="#756b5c" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="84" y="727" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace">CALL</text>
        <line x1="160" y1="724" x2="196" y2="724" stroke="#756b5c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="204" y="727" fill="#756b5c" font-size="8" font-family="'IBM Plex Mono', monospace">RETURN</text>
        <line x1="296" y1="724" x2="332" y2="724" stroke="#ff4d00" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="340" y="727" fill="#ff4d00" font-size="8" font-family="'IBM Plex Mono', monospace">DECISION / PAYOUT</text>
      </svg>
    </div>
  </div>
</body>
</html>
